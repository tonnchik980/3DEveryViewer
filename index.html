<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Модели — каталог</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font-family: sans-serif;
    display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
  h1 { font-size: 24px; font-weight: normal; }
  #status { color: #888; font-size: 14px; padding: 10px; }
  .item { display: block; background: rgba(30,30,30,.92); border: 1px solid #444;
    border-radius: 8px; color: #eee; text-decoration: none; font-size: 16px;
    padding: 14px 22px; margin: 6px; width: 260px; text-align: center; }
  .item:hover { background: #3a3a3a; }
  .item .sub { display: block; color: #888; font-size: 11px; margin-top: 3px; }
</style>
</head>
<body>
<h1>3D Модели</h1>
<div id="status">Загружаю список моделей…</div>
<div id="list"></div>

<script>
(function () {
  var USER = 'tonnchik980';
  var REPO = '3DEveryViewer';
  var BRANCH = 'main';

  var status = document.getElementById('status');
  var list = document.getElementById('list');

  // Необязательно: ручные переименования, если автоимя не нравится.
  // Ключ — имя папки, значение — подпись в каталоге.
  var OVERRIDES = {
    // 'model1': 'Кронштейн насоса'
  };

  fetch('https://api.github.com/repos/' + USER + '/' + REPO + '/contents/?ref=' + BRANCH)
    .then(function (r) {
      if (!r.ok) throw new Error('GitHub API: ' + r.status);
      return r.json();
    })
    .then(function (items) {
      var dirs = items.filter(function (i) { return i.type === 'dir'; });
      if (!dirs.length) throw new Error('Папок с моделями не найдено');
      return Promise.all(dirs.map(function (d) {
        return fetch('https://raw.githubusercontent.com/' + USER + '/' + REPO +
                     '/' + BRANCH + '/' + d.name + '/index.html')
          .then(function (r) { if (!r.ok) throw 0; return r.text(); })
          .then(function (html) {
            var m = html.match(/<title>([^<]*)<\/title>/i);
            var name = OVERRIDES[d.name] || (m ? m[1].trim() : d.name);
            return { folder: d.name, name: name };
          })
          .catch(function () { return null; }); // папка без index.html — пропускаем
      }));
    })
    .then(function (entries) {
      entries = entries.filter(Boolean);
      if (!entries.length) throw new Error('Ни в одной папке нет index.html');
      entries.sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); });
      status.style.display = 'none';
      entries.forEach(function (e) {
        var a = document.createElement('a');
        a.className = 'item';
        a.href = e.folder + '/';
        a.textContent = e.name;
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = e.folder;
        a.appendChild(sub);
        list.appendChild(a);
      });
    })
    .catch(function (e) {
      status.textContent = 'Не удалось получить список: ' + (e.message || e) +
        '. Обновите страницу через минуту или проверьте интернет.';
    });
})();
</script>
</body>
</html>
